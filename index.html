<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcolo spesa pellet</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  margin:0;
  padding:20px;
}

.container{
  max-width:500px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:none;
  background:#ff6600;
  color:white;
  font-size:18px;
  border-radius:10px;
  cursor:pointer;
}

button:hover{
  background:#e65c00;
}

.risultato{
  margin-top:20px;
  font-size:20px;
  text-align:center;
  font-weight:bold;
}

.prodotti{
  margin-top:40px;
}

.prodotti a{
  display:block;
  margin:10px 0;
  text-decoration:none;
  background:#eef2f5;
  padding:12px;
  border-radius:8px;
  color:#333;
}
</style>
</head>

<body>

<div class="container">

<h1>🔥 Calcolo spesa pellet</h1>

<label>Prezzo sacco (€)</label>
<input type="number" id="prezzo" placeholder="es. 6.50">

<label>Sacchi al mese</label>
<input type="number" id="sacchi" placeholder="es. 30">

<button onclick="calcola()">Calcola spesa</button>

<div class="risultato" id="risultato"></div>

<div class="prodotti">
<h2>🧰 Prodotti per risparmiare</h2>

<a href="#">Aspiracenere pellet consigliato</a>
<a href="#">Kit pulizia stufa</a>
<a href="#">Pellet di qualità</a>
<a href="#">Termostato per risparmiare</a>

</div>

</div>

<script>
function calcola(){
  const prezzo = parseFloat(document.getElementById("prezzo").value);
  const sacchi = parseFloat(document.getElementById("sacchi").value);

  if(isNaN(prezzo) || isNaN(sacchi)){
    document.getElementById("risultato").innerHTML="Inserisci i valori";
    return;
  }

  const mensile = prezzo * sacchi;
  const annuale = mensile * 12;

  document.getElementById("risultato").innerHTML =
  "Spesa mensile: € " + mensile.toFixed(2) +
  "<br>Spesa annua: € " + annuale.toFixed(2);
}
</script>

</body>
</html>
