<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolo Spesa Pellet</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            margin:0;
            padding:20px;
        }

        .container{
            max-width:500px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
            border-radius:6px;
            border:1px solid #ccc;
        }

        button{
            width:100%;
            padding:12px;
            background:#2e7d32;
            color:white;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1b5e20;
        }

        #risultato{
            margin-top:15px;
            font-weight:bold;
            text-align:center;
        }

        .prodotti{
            margin-top:30px;
        }

        .prodotti ul{
            list-style:none;
            padding:0;
        }

        .prodotti li{
            margin-bottom:12px;
        }

        .btn-affiliazione{
            background:#ff6600;
            color:white;
            padding:6px 12px;
            border-radius:6px;
            text-decoration:none;
            font-weight:bold;
        }

        .btn-affiliazione:hover{
            background:#e65100;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 Calcolo Spesa Pellet</h1>

    <label>Prezzo di un sacco (€)</label>
    <input type="number" id="prezzo" placeholder="Es. 5.50">

    <label>Numero sacchi al mese</label>
    <input type="number" id="sacchi" placeholder="Es. 30">

    <button onclick="calcolaSpesa()">Calcola spesa</button>

    <div id="risultato"></div>

    <div class="prodotti">
        <h3>🛒 Prodotti consigliati</h3>
        <ul>
            <li>
                🌡️ Termostato WiFi consigliato:
                <a href="https://amzn.to/3MsTovy" target="_blank" class="btn-affiliazione">
                    🔥 Acquista su Amazon
                </a>
            </li>

            <li>
                🧹 Aspiracenere per stufa:
                <a href="#" target="_blank" class="btn-affiliazione">
                    Vedi su Amazon
                </a>
            </li>

            <li>
                🪵 Pellet alta qualità:
                <a href="#" target="_blank" class="btn-affiliazione">
                    Vedi su Amazon
                </a>
            </li>
        </ul>
    </div>
</div>

<script>
function calcolaSpesa(){
    let prezzo = parseFloat(document.getElementById("prezzo").value);
    let sacchi = parseFloat(document.getElementById("sacchi").value);

    if(isNaN(prezzo) || isNaN(sacchi)){
        document.getElementById("risultato").innerText = "Inserisci valori validi.";
        return;
    }

    let totale = prezzo * sacchi;
    document.getElementById("risultato").innerText = 
        "Spesa mensile: € " + totale.toFixed(2);
}
</script>

</body>
</html>
