<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolo Spesa Pellet</title>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: auto;
            padding: 20px;
            background-color: #f7f7f7;
            color: #333;
        }

        header, footer {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #2c3e50;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
            margin-top: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background-color: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2ecc71;
        }

        .result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
        }

        section.calculator, section.affiliates {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        label {
            margin-top: 10px;
            display: block;
        }

        .affiliate-links a {
            display: inline-block;
            margin: 5px 0;
            padding: 10px;
            background-color: #ff9900;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .affiliate-links a:hover {
            background-color: #e68a00;
        }

        canvas {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Calcolo Consumo e Spesa Pellet</h1>
</header>

<main>
    <!-- Calcolatore -->
    <section class="calculator">
        <label for="price">Prezzo di un sacco (€)</label>
        <input type="number" id="price" placeholder="Es. 5.50" step="0.01">

        <label for="bags">Sacchi consumati al mese</label>
        <input type="number" id="bags" placeholder="Es. 10">

        <button id="calculateBtn">Calcola spesa</button>

        <div class="result" id="result"></div>

        <canvas id="costChart" width="400" height="200"></canvas>
    </section>

    <!-- Link affiliati Amazon -->
    <section class="affiliates">
        <h2>Acquista Pellet su Amazon</h2>
        <div class="affiliate-links">
            <a href="https://amzn.to/4bbxpT5tag=tuo-affiliate-id" target="_blank">Sacco Pellet 15kg</a>
            <a href="https://www.amazon.it/dp/B07H5C9RJK?tag=tuo-affiliate-id" target="_blank">Pellet Premium</a>
            <a href="https://www.amazon.it/dp/B08L5V6W2P?tag=tuo-affiliate-id" target="_blank">Offerta Pellet</a>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2026 Manutenzione Pellet</p>
</footer>

<script>
    const ctx = document.getElementById('costChart').getContext('2d');
    let chart;

    document.getElementById("calculateBtn").addEventListener("click", function() {
        const price = parseFloat(document.getElementById("price").value);
        const bags = parseFloat(document.getElementById("bags").value);

        if (isNaN(price) || isNaN(bags) || price <= 0 || bags <= 0) {
            document.getElementById("result").innerText = "Inserisci valori validi maggiori di zero!";
            return;
        }

        const monthly = price * bags;
        const yearly = monthly * 12;

        document.getElementById("result").innerHTML =
            `Spesa mensile stimata: € ${monthly.toFixed(2)}<br>` +
            `Spesa annuale stimata: € ${yearly.toFixed(2)}`;

        // Se il grafico esiste già, distruggerlo prima di crearne uno nuovo
        if (chart) {
            chart.destroy();
        }

        chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Mensile', 'Annuale'],
                datasets: [{
                    label: 'Spesa (€)',
                    data: [monthly, yearly],
                    backgroundColor: ['#27ae60', '#2c3e50']
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    });
</script>

</body>
</html>
