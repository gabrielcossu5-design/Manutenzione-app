<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcolo Spesa Pellet</title>

<style>
body{
    font-family:Arial;
    background:#0f0f0f;
    color:white;
    text-align:center;
    padding:25px;
}

h1{color:#ff9900;}

input,button{
    padding:12px;
    margin:8px;
    font-size:18px;
    border-radius:6px;
    border:none;
}

button{
    background:#ff9900;
    font-weight:bold;
    cursor:pointer;
}

.result{
    font-size:22px;
    margin-top:20px;
    color:#00ff88;
}

.box{
    background:#1c1c1c;
    padding:20px;
    margin:20px auto;
    max-width:500px;
    border-radius:10px;
}

.btn{
    display:inline-block;
    padding:10px 20px;
    margin-top:10px;
    background:#ff9900;
    color:black;
    text-decoration:none;
    font-weight:bold;
    border-radius:6px;
}
</style>
</head>

<body>

<h1>🔥 Calcolo Consumo Pellet</h1>

<p>Prezzo sacco (€)</p>
<input type="number" id="prezzo" step="0.01">

<p>Sacchi al mese</p>
<input type="number" id="sacchi">

<br>
<button onclick="calcola()">Calcola</button>

<div class="result" id="risultato"></div>
<div id="consiglio"></div>
<div id="prodotti"></div>

<script>
function calcola(){

let prezzo = parseFloat(document.getElementById("prezzo").value);
let sacchi = parseFloat(document.getElementById("sacchi").value);

if(isNaN(prezzo)||isNaN(sacchi)){alert("Inserisci valori");return;}

let mensile = prezzo*sacchi;
let stagione = mensile*6;

document.getElementById("risultato").innerHTML=
"Spesa mensile: "+mensile.toFixed(2)+" €<br>"+
"Stagione: "+stagione.toFixed(2)+" €";

let html="";

html+=`
<div class="box">
<h3>🔥 Pellet consigliato</h3>
<p>Pellet certificato per miglior resa.</p>
<a href="https://amzn.to/4aWETIp" target="_blank" class="btn">Vedi offerta</a>
</div>
`;

if(sacchi>10){
html+=`
<div class="box">
<h3>🧰 Kit pulizia stufa</h3>
<p>Pulizia settimanale consigliata.</p>
<a href="https://amzn.to/4s9idvr" target="_blank" class="btn">Vedi prodotto</a>
</div>
`;
}

if(sacchi>20){
html+=`
<div class="box">
<h3>🔧 Aspiracenere</h3>
<p>Con questo consumo serve pulizia frequente.</p>
<a href="https://amzn.to/4azK2Y0" target="_blank" class="btn">Vedi su Amazon</a>
</div>
`;
}

html+=`
<div class="box">
<h3>🌡️ Termostato digitale</h3>
<p>Riduce i consumi e ottimizza la temperatura.</p>
<a href="https://amzn.to/4saBqNi" target="_blank" class="btn">Scopri</a>
</div>
`;

document.getElementById("prodotti").innerHTML=html;

}
</script>

</body>
</html>
