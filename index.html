<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Risparmio Pellet</title>

<style>
body{
background:#0d0d0d;
color:white;
font-family:sans-serif;
text-align:center;
padding:30px;
}

input,button{
padding:12px;
margin:10px;
border-radius:8px;
border:none;
font-size:16px;
}

button{
background:#00c853;
color:white;
font-weight:bold;
}

.card{
background:#1a1a1a;
padding:20px;
border-radius:12px;
margin-top:25px;
}

a{
color:#00e5ff;
font-size:18px;
text-decoration:none;
}

a:hover{
color:#00ffc3;
}
</style>
</head>

<body>

<h1>💰 Calcolo spesa pellet</h1>

<p>Quanto paghi un sacco di pellet (€)?</p>
<input id="prezzo" type="number" placeholder="es. 6">

<p>Quanti sacchi al mese?</p>
<input id="sacchi" type="number" placeholder="es. 30">

<br>
<button onclick="calcola()">Calcola spesa</button>

<div id="risultato" class="card" style="display:none"></div>

<!-- SEZIONE PRODOTTI -->
<div class="card">

<h2>🔥 Prodotti consigliati per risparmiare</h2>

<a href="https://amzn.to/4ldkmUV" target="_blank">
🧹 Aspiracenere pellet consigliato
</a>

<br><br>

<a href="https://amzn.to/4cHe0uw" target="_blank">
🧽 Kit pulizia stufa
</a>

<br><br>

<a href="https://amzn.to/4kR0PsY" target="_blank">
🪵 Pellet di qualità
</a>

<br><br>

<a href="https://amzn.to/4aOhVmz" target="_blank">
🌡️ Termostato per risparmiare pellet
</a>

</div>

<script>
function calcola(){
let prezzo=document.getElementById("prezzo").value;
let sacchi=document.getElementById("sacchi").value;

if(prezzo==="" || sacchi===""){
alert("Inserisci tutti i valori");
return;
}

let totale=prezzo*sacchi;

document.getElementById("risultato").style.display="block";
document.getElementById("risultato").innerHTML=
"Hai speso circa <b>"+totale+"€ al mese</b><br><br>"+
"≈ <b>"+(totale*12)+"€ l'anno</b>";
}
</script>

</body>
</html>
